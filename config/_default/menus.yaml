# Navigation Links
#   To link a homepage widget, specify the URL as a hash `#` followed by the filename of the
  #     desired widget in your `content/home/` folder.
  #   The weight parameter defines the order that the links will appear in.


#### NOTE: THIS WORKS FOR SINGLE LANGUAGE PAGES, FOR MULTILINGUAL PAGES USE languages.yaml

# # English menu
# en:
#   main:
#     - name: Home
#       url: /
#       weight: 10
#     - name: Experience
#       url: /#experience
#       weight: 20
#     - name: Skills
#       url: /#skills
#       weight: 30
#     - name: Projects
#       url: /#projects
#       weight: 40

